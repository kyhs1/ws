                      className={`w-full rounded-xl border border-slate-200 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-50 outline-none font-bold transition-all ${isDesktopMode ? 'p-5 text-base' : 'p-4 text-sm'}`}
                    />
                  </div>

                  <div>
                    <div className="flex justify-between items-end mb-2">
                      <label className={`font-bold text-slate-500 uppercase tracking-widest block ${isDesktopMode ? 'text-xs' : 'text-[10px]'}`}>데이터 본문</label>
                      <label className="cursor-pointer bg-indigo-50 text-indigo-600 px-4 py-2 rounded-xl flex items-center gap-2 hover:bg-indigo-100 transition-colors active:scale-95 shadow-sm">
                        <Icon name="FileSpreadsheet" size={isDesktopMode ? 18 : 14} />
                        <span className={`font-bold ${isDesktopMode ? 'text-xs' : 'text-[10px]'}`}>엑셀 파일 첨부</span>
                        <input type="file" accept=".xlsx, .xls, .csv" className="hidden" onChange={handleFileUpload} />
                      </label>
                    </div>
                    <textarea
                      value={importText} onChange={(e) => setImportText(e.target.value)}
                      placeholder="A열에는 '문제', B열에는 '정답'이 적혀있는 엑셀 영역을 드래그하여 복사한 후, 여기에 그대로 붙여넣기 하세요!&#13;&#10;&#13;&#10;또는 오른쪽 위 [엑셀 파일 첨부] 버튼을 눌러 파일을 직접 올릴 수도 있습니다."
                      className={`w-full rounded-xl border border-slate-200 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-50 outline-none resize-none leading-relaxed transition-all ${isDesktopMode ? 'h-96 p-6 text-sm' : 'h-56 p-4 text-xs'}`}
                    />
                  </div>

                  <div className="flex gap-3 pt-2">
                    <button onClick={() => { setImportText(""); setImportSubjectName(""); setView('home'); }} className={`flex-1 bg-slate-100 text-slate-500 rounded-xl font-bold hover:bg-slate-200 transition-colors ${isDesktopMode ? 'py-5 text-sm' : 'py-4 text-xs'}`}>취소</button>
                    <button onClick={handleImport} className={`flex-[2] bg-indigo-600 text-white rounded-xl font-black shadow-lg shadow-indigo-200 hover:bg-indigo-700 active:scale-[0.98] transition-all tracking-widest ${isDesktopMode ? 'py-5 text-sm' : 'py-4 text-xs'}`}>CLOUD UPLOAD</button>
                  </div>
                </div>
              </div>
            )}

            {/* 암기박스 업로드 화면 (7열 형식: 문제/정답/오답1~3/단원/해설) */}
            {view === 'ambox-import' && (
              <div className="h-full animate-in max-w-3xl mx-auto w-full">
                <h3 className={`font-black text-slate-800 mb-6 flex items-center gap-2 ${isDesktopMode ? 'text-xl' : 'text-sm'}`}>
                  <Icon name="Archive" size={isDesktopMode ? 24 : 18} className="text-amber-500" /> 암기박스 문제집 등록
                </h3>

                <div className={`bg-amber-50 border border-amber-200 rounded-2xl mb-6 ${isDesktopMode ? 'p-6' : 'p-4'}`}>
                  <p className={`text-amber-700 font-bold leading-relaxed ${isDesktopMode ? 'text-sm' : 'text-[11px]'}`}>
                    📋 엑셀 형식: A열 문제 · B열 정답 · C~E열 오답1~3 · F열 단원 · G열 해설<br/>
                    <span className="font-medium opacity-80">단원·해설은 비어 있어도 됩니다. 첫 행이 제목 행(문제/정답...)이면 자동으로 건너뜁니다.</span>
                  </p>
                </div>

                <div className={`space-y-6 bg-white rounded-3xl border border-slate-100 shadow-sm ${isDesktopMode ? 'p-10' : 'p-5'}`}>
                  <div>
                    <label className={`font-bold text-slate-500 uppercase tracking-widest mb-2 block ${isDesktopMode ? 'text-xs' : 'text-[10px]'}`}>문제집 이름</label>
                    <input
                      type="text"
                      value={importSubjectName}
                      onChange={(e) => setImportSubjectName(e.target.value)}
                      placeholder="예: 상담이론 암기박스 1"
                      className={`w-full rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-50 outline-none font-bold transition-all ${isDesktopMode ? 'p-5 text-base' : 'p-4 text-sm'}`}
                    />
                  </div>

                  <div>
                    <div className="flex justify-between items-end mb-2">
                      <label className={`font-bold text-slate-500 uppercase tracking-widest block ${isDesktopMode ? 'text-xs' : 'text-[10px]'}`}>데이터 본문</label>
                      <label className="cursor-pointer bg-amber-50 text-amber-600 px-4 py-2 rounded-xl flex items-center gap-2 hover:bg-amber-100 transition-colors active:scale-95 shadow-sm">
                        <Icon name="FileSpreadsheet" size={isDesktopMode ? 18 : 14} />
                        <span className={`font-bold ${isDesktopMode ? 'text-xs' : 'text-[10px]'}`}>엑셀 파일 첨부</span>
                        <input type="file" accept=".xlsx, .xls, .csv" className="hidden" onChange={handleAmboxFileUpload} />
                      </label>
                    </div>
                    <textarea
                      value={importText} onChange={(e) => setImportText(e.target.value)}
                      placeholder="문제/정답/오답1/오답2/오답3/단원/해설 순서로 정리된 엑셀 영역을 드래그하여 복사한 후, 여기에 그대로 붙여넣기 하세요!&#13;&#10;&#13;&#10;또는 오른쪽 위 [엑셀 파일 첨부] 버튼을 눌러 파일을 직접 올릴 수도 있습니다."
                      className={`w-full rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-50 outline-none resize-none leading-relaxed transition-all ${isDesktopMode ? 'h-96 p-6 text-sm' : 'h-56 p-4 text-xs'}`}
                    />
                  </div>

                  <div className="flex gap-3 pt-2">
                    <button onClick={() => { setImportText(""); setImportSubjectName(""); setView('ambox-home'); }} className={`flex-1 bg-slate-100 text-slate-500 rounded-xl font-bold hover:bg-slate-200 transition-colors ${isDesktopMode ? 'py-5 text-sm' : 'py-4 text-xs'}`}>취소</button>
                    <button onClick={handleAmboxImport} className={`flex-[2] bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-xl font-black shadow-lg shadow-amber-200 hover:from-amber-600 hover:to-orange-600 active:scale-[0.98] transition-all tracking-widest ${isDesktopMode ? 'py-5 text-sm' : 'py-4 text-xs'}`}>암기박스 UPLOAD</button>
                  </div>
                </div>
              </div>
            )}

            {/* 퀴즈 결과 화면 */}
            {view === 'result' && (
              <div className="flex flex-col items-center pt-8 text-center animate-in pb-12 max-w-2xl mx-auto w-full">
                <div className={`bg-emerald-50 text-emerald-500 rounded-[2rem] flex items-center justify-center shadow-inner mb-8 mx-auto ${isDesktopMode ? 'w-28 h-28' : 'w-20 h-20'}`}>
                  <Icon name="CheckCircle2" size={isDesktopMode ? 56 : 40} />
                </div>
                <h2 className={`font-black text-slate-800 mb-8 tracking-tighter uppercase ${isDesktopMode ? 'text-3xl' : 'text-lg'}`}>Finished!</h2>

                <div className={`bg-white w-full rounded-3xl border border-slate-100 shadow-sm mb-8 ${isDesktopMode ? 'p-10' : 'p-6'}`}>
                  <div className={`text-slate-300 font-black uppercase tracking-[0.3em] mb-2 ${isDesktopMode ? 'text-xs' : 'text-[9px]'}`}>Score</div>
                  <div className={`font-black text-indigo-600 ${isDesktopMode ? 'text-6xl' : 'text-4xl'}`}>{quizScore} <span className={`text-slate-200 font-light mx-2 ${isDesktopMode ? 'text-3xl' : 'text-base'}`}>/</span> {quizList.length}</div>
                  <div className={`text-slate-400 font-bold mt-3 ${isDesktopMode ? 'text-xs' : 'text-[10px]'}`}>
                    전체 {cards.length}문항 중 {quizList.length}문항 랜덤 출제
                  </div>
                </div>

                {/* 틀린 문제 → 오답노트 슬롯 저장 */}
                {quizWrongCards.length > 0 && (
                  <div className="w-full space-y-4 mb-8">
                    <button
                      onClick={() => startStudy('quizWrong')}
                      className={`w-full bg-rose-500 text-white rounded-2xl font-black shadow-xl shadow-rose-200 hover:bg-rose-600 active:scale-95 transition-all flex items-center justify-center gap-2 ${isDesktopMode ? 'py-6 text-sm' : 'py-4 text-xs'}`}
                    >
                      <Icon name="RotateCcw" size={isDesktopMode ? 20 : 16} /> 틀린 {quizWrongCards.length}문제 지금 카드로 복습하기
                    </button>

                    <div className="bg-white rounded-2xl border border-rose-100 p-4 md:p-6 shadow-sm text-center">
                      <h3 className={`font-black text-rose-600 mb-4 flex justify-center items-center gap-2 ${isDesktopMode ? 'text-sm' : 'text-xs'}`}>
                        <Icon name="Save" size={16} /> 틀린 {quizWrongCards.length}문제를 오답노트 슬롯에 저장
                      </h3>
                      <div className="flex gap-2 overflow-x-auto pb-4 px-1 custom-scrollbar justify-start">
                        {[1,2,3,4,5].map(num => (
                          <button
                            key={num}
                            onClick={() => saveToSlot(num, quizWrongCards)}
                            className={`flex-shrink-0 flex flex-col items-center justify-center p-3 rounded-xl border-2 transition-all w-14 md:w-16 active:scale-95 ${
                                savedSlots[num] ? 'border-rose-200 bg-rose-50 text-rose-600 hover:bg-rose-100' : 'border-slate-100 bg-slate-50 text-slate-500 hover:bg-slate-100'
                            }`}
                          >
                            <span className={`font-black ${isDesktopMode ? 'text-lg' : 'text-base'}`}>S{num}</span>
                            <span className="text-[8px] font-bold mt-1 text-slate-400">{savedSlots[num] ? '덮어쓰기' : '저장'}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                <div className="w-full text-left space-y-4 mb-10">
                  <h3 className={`font-black text-slate-400 uppercase tracking-widest flex items-center gap-2 mb-4 px-2 ${isDesktopMode ? 'text-sm' : 'text-[10px]'}`}>
                    <Icon name="AlertCircle" size={isDesktopMode ? 16 : 12} /> Review
                  </h3>
                  {quizResults.map((res, idx) => (
                    <div key={idx} className={`rounded-2xl border ${res.isCorrect ? 'bg-white border-slate-100' : 'bg-rose-50/40 border-rose-100'} ${isDesktopMode ? 'p-6' : 'p-4'}`}>
                      <div className="flex justify-between items-center mb-3">
                        <span className={`font-black text-slate-400 uppercase ${isDesktopMode ? 'text-xs' : 'text-[8px]'}`}>Q{idx + 1}</span>
                        <span className={`font-bold uppercase tracking-widest ${isDesktopMode ? 'text-xs' : 'text-[8px]'} ${res.isCorrect ? 'text-emerald-500' : 'text-rose-500'}`}>
                          {res.isCorrect ? 'Correct' : 'Incorrect'}
                        </span>
                      </div>
                      <p className={`font-bold text-slate-800 mb-4 ${isDesktopMode ? 'text-base leading-relaxed' : 'text-xs'}`}>{res.question}</p>

                      <div className="space-y-2.5 pt-4 border-t border-slate-100">
                        <div className="flex gap-3">
                          <span className={`font-black text-slate-400 pt-0.5 uppercase ${isDesktopMode ? 'text-[10px] w-14' : 'text-[8px] w-10'}`}>Yours</span>
                          <span className={`${isDesktopMode ? 'text-sm' : 'text-[11px]'} ${res.isCorrect ? 'text-emerald-600' : 'text-rose-500 font-bold'}`}>{res.userAnswer || "(None)"}</span>
                        </div>
                        {!res.isCorrect && (
                          <div className="flex gap-3">
                            <span className={`font-black text-indigo-400 pt-0.5 uppercase ${isDesktopMode ? 'text-[10px] w-14' : 'text-[8px] w-10'}`}>Answer</span>
                            <span className={`text-indigo-600 font-bold whitespace-pre-wrap ${isDesktopMode ? 'text-sm' : 'text-[11px]'}`}>{res.correctAnswer}</span>
                          </div>
                        )}
                        {!res.isCorrect && res.explanation && (
                          <div className="flex gap-3">
                            <span className={`font-black text-amber-500 pt-0.5 uppercase ${isDesktopMode ? 'text-[10px] w-14' : 'text-[8px] w-10'}`}>해설</span>
                            <span className={`text-slate-500 whitespace-pre-wrap ${isDesktopMode ? 'text-sm' : 'text-[11px]'}`}>{res.explanation}</span>
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>

                <button onClick={() => setView('subject-home')} className={`w-full bg-slate-900 text-white rounded-2xl font-black shadow-xl hover:bg-slate-800 active:scale-95 transition-all flex items-center justify-center gap-2 tracking-widest uppercase ${isDesktopMode ? 'py-6 text-sm' : 'py-4 text-[10px]'}`}>
                  <Icon name="RotateCcw" size={isDesktopMode ? 20 : 16} /> Retry This Subject
                </button>
              </div>
            )}

          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
