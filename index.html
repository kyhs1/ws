<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스마트 스터디 마스터 - 임용 합격</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (브라우저에서 JSX 변환용) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SheetJS (엑셀 파일 처리) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Firebase v8 (CDN 방식 적용) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
    .animate-in { animation: fadeIn 0.3s ease-in-out; }
    .slide-in-from-bottom-2 { animation: slideUp 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    
    .preserve-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 사용자의 Firebase 설정값 ---
    const firebaseConfig = {
      apiKey: "AIzaSyCzzNzdmAfXhZ0ElcLeIHQb0z5Qbbj8fFs",
      authDomain: "wstudy-7ce99.firebaseapp.com",
      projectId: "wstudy-7ce99",
      storageBucket: "wstudy-7ce99.firebasestorage.app",
      messagingSenderId: "83989948418",
      appId: "1:83989948418:web:d7d717b36e0d4733dd1f1b",
      measurementId: "G-DRQZS1GRW4"
    };

    // Firebase 초기화
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const APP_ID = 'study-master-v1'; 

    // 아이콘 컴포넌트 (버전 호환성 에러 수정 완료)
    const Icon = ({ name, size = 24, className = "" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current) {
          // 최신 Lucide 버전의 아이콘명 변경 대응
          let actualName = name;
          if (name === 'CheckCircle2' && !lucide.icons['CheckCircle2']) actualName = 'CircleCheck';
          if (name === 'AlertCircle' && !lucide.icons['AlertCircle']) actualName = 'CircleAlert';
          
          const iconData = lucide.icons[actualName] || lucide.icons.Circle;
          
          iconRef.current.innerHTML = `<i data-lucide="${actualName}"></i>`;
          lucide.createIcons({
            root: iconRef.current,
            icons: { [actualName]: iconData },
            attrs: { class: className, width: size, height: size }
          });
        }
      }, [name, size, className]);
      return <span ref={iconRef} className="inline-flex items-center justify-center" style={{ width: size, height: size }}></span>;
    };

    const App = () => {
      const [user, setUser] = useState(null);
      const [view, setView] = useState('home'); 
      const [subjects, setSubjects] = useState([]); 
      const [selectedSubject, setSelectedSubject] = useState(null); 
      const [cards, setCards] = useState([]); 
      const [currentCardIndex, setCurrentCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [isTransitioning, setIsTransitioning] = useState(false); // 엔터키 연타 에러 방지
      const [quizScore, setQuizScore] = useState(0);
      const [quizResults, setQuizResults] = useState([]); 
      const [quizType, setQuizType] = useState(null); 
      const [userTypedAnswer, setUserTypedAnswer] = useState("");
      const [importText, setImportText] = useState("");
      const [importSubjectName, setImportSubjectName] = useState(""); 
      const [feedback, setFeedback] = useState(null);
      const [isLoading, setIsLoading] = useState(true);

      // --- 인증 로직 ---
      useEffect(() => {
        auth.signInAnonymously().catch(error => {
          console.error("익명 로그인 실패:", error);
          showFeedback("로그인에 실패했습니다.");
          setIsLoading(false);
        });

        const unsubscribe = auth.onAuthStateChanged((u) => {
          setUser(u);
          if(!u) setIsLoading(false);
        });
        return () => unsubscribe();
      }, []);

      // --- 과목 리스트 가져오기 ---
      useEffect(() => {
        if (!user) return;
        const subjectsRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('subjects');
        
        const unsubscribe = subjectsRef.onSnapshot((snapshot) => {
          const subList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setSubjects(subList);
          setIsLoading(false);
        }, (error) => {
          console.error("Firestore Error:", error);
          showFeedback("데이터베이스 권한(Rules) 설정을 확인해주세요!");
          setIsLoading(false);
        });
        return () => unsubscribe();
      }, [user]);

      // --- 특정 과목 카드 불러오기 ---
      const loadCards = async (subjectId) => {
        setIsLoading(true);
        try {
          const cardsRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('subjects').doc(subjectId).collection('cards');
          const snapshot = await cardsRef.get();
          let loadedCards = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          
          // 랜덤 셔플
          for (let i = loadedCards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [loadedCards[i], loadedCards[j]] = [loadedCards[j], loadedCards[i]];
          }

          setCards(loadedCards);
          const sub = subjects.find(s => s.id === subjectId);
          setSelectedSubject(sub);
          setView('subject-home');
        } catch (e) {
          showFeedback("데이터를 불러오는 중 오류가 발생했습니다.");
        } finally {
          setIsLoading(false);
        }
      };

      // --- 음성 인식 (STT) ---
      const startListening = () => {
        if (isTransitioning) return; 
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          showFeedback("음성 인식을 지원하지 않는 브라우저입니다.");
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'ko-KR';
        recognition.onstart = () => setIsListening(true);
        recognition.onend = () => setIsListening(false);
        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          checkAnswer(transcript);
        };
        recognition.start();
      };

      // --- 플래시 카드 터치 로직 ---
      const handleCardClick = () => {
        if (!isFlipped) {
          setIsFlipped(true);
        } else {
          if (currentCardIndex < cards.length - 1) {
            setIsFlipped(false);
            setTimeout(() => { setCurrentCardIndex(prev => prev + 1); }, 150); 
          } else {
            setView('subject-home');
            showFeedback("학습을 완료했습니다!");
          }
        }
      };

      // --- 엑셀 파일 로드 ---
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = window.XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const json = window.XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            
            const formatCell = (cell) => {
               let str = String(cell || '').trim();
               if (str.includes('\n') || str.includes(',') || str.includes('"')) {
                   return `"${str.replace(/"/g, '""')}"`;
               }
               return str;
            };

            const parsedText = json
              .filter(row => row.length >= 2 && row[0] !== undefined && row[1] !== undefined)
              .map(row => `${formatCell(row[0])},${formatCell(row[1])}`)
              .join('\n');
            
            setImportText(prev => prev ? prev + '\n' + parsedText : parsedText);
            showFeedback("엑셀 변환 완료! 내용을 확인하고 업로드하세요.");
          } catch (error) {
            console.error(error);
            showFeedback("파일 파싱 오류가 발생했습니다.");
          }
        };
        reader.readAsArrayBuffer(file);
        e.target.value = ''; 
      };

      // --- 클라우드 업로드 ---
      const handleImport = async () => {
        if (!importSubjectName.trim() || !importText.trim()) {
          showFeedback("과목명과 데이터를 모두 입력해주세요.");
          return;
        }

        setIsLoading(true);
        try {
          const subjectsRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('subjects');
          const subjectDocRef = subjectsRef.doc(importSubjectName.trim());
          
          await subjectDocRef.set({
            name: importSubjectName.trim(),
            updatedAt: Date.now(),
            uploader: user.uid
          });

          const cardsRef = subjectDocRef.collection('cards');
          
          let uploadCount = 0;
          let currentRow = "";
          let inQuotes = false;

          const parsedRows = [];
          for (let i = 0; i < importText.length; i++) {
            const char = importText[i];
            if (char === '"') inQuotes = !inQuotes;
            if (!inQuotes && char === '\n') {
              parsedRows.push(currentRow);
              currentRow = "";
            } else {
              currentRow += char;
            }
          }
          if (currentRow) parsedRows.push(currentRow);

          for (const row of parsedRows) {
            const parts = row.split(/\t|,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if (parts.length < 2) continue;
            
            let q = parts[0].replace(/^"|"$/g, '').trim();
            let a = parts[1].replace(/^"|"$/g, '').trim();

            const categoryMatch = q.match(/^\[(.*?)\]/);
            const category = categoryMatch ? categoryMatch[1] : "일반";
            const cleanQuestion = q.replace(/^\[.*?\]/, '').trim();

            await cardsRef.add({
              category,
              question: cleanQuestion,
              answer: a,
              createdAt: Date.now()
            });
            uploadCount++;
          }

          setImportText("");
          setImportSubjectName("");
          setView('home');
          showFeedback(`${uploadCount}개의 문항이 등록되었습니다!`);
        } catch (e) {
          console.error(e);
          showFeedback("업로드 중 오류가 발생했습니다.");
        } finally {
          setIsLoading(false);
        }
      };

      const showFeedback = (msg) => {
        setFeedback(msg);
        setTimeout(() => setFeedback(null), 3000);
      };

      // --- 정답 체크 로직 (에러 완벽 방어) ---
      const checkAnswer = (userAnswer) => {
        if (isTransitioning) return; 
        const currentCard = cards[currentCardIndex];
        if (!currentCard) return; 

        setIsTransitioning(true); 

        const normalize = (str) => str.replace(/[^a-zA-Z0-9가-힣ㄱ-ㅎ]/g, "").toLowerCase();
        const correctAnswer = currentCard.answer;
        
        const isCorrect = normalize(userAnswer) === normalize(correctAnswer) || 
                          (correctAnswer.includes('\n') && normalize(correctAnswer).includes(normalize(userAnswer)) && userAnswer.length > 1);
        
        setQuizResults(prev => [...prev, {
          question: currentCard.question,
          userAnswer: userAnswer,
          correctAnswer: correctAnswer,
          isCorrect: isCorrect
        }]);

        if (isCorrect) {
          setQuizScore(s => s + 1);
          showFeedback("정답입니다! 🎉");
        } else {
          showFeedback(`오답입니다.`);
        }
        
        setUserTypedAnswer("");
        
        setTimeout(() => {
          if (currentCardIndex < cards.length - 1) {
            setCurrentCardIndex(i => i + 1);
            setIsFlipped(false);
          } else {
            setView('result');
          }
          setIsTransitioning(false); 
        }, 1500);
      };

      const startQuiz = (type) => {
        if (cards.length === 0) {
          showFeedback("문제가 없습니다.");
          return;
        }
        setQuizType(type);
        setCurrentCardIndex(0);
        setQuizScore(0);
        setQuizResults([]);
        setIsTransitioning(false);
        setView('quiz');
      };

      const Header = () => (
        <div className="flex items-center justify-between py-2.5 px-4 bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-10">
          <button onClick={() => setView('home')} className="p-2 hover:bg-slate-100 rounded-xl transition-all active:scale-90">
            <Icon name="Home" className="text-indigo-600" size={22} />
          </button>
          <h1 className="text-base font-black text-slate-800 tracking-tight">Smart Study</h1>
          <div className="w-10"></div>
        </div>
      );

      const LoadingOverlay = () => (
        <div className="fixed inset-0 bg-white/60 backdrop-blur-sm z-[100] flex items-center justify-center">
          <div className="flex flex-col items-center">
            <div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p className="text-sm font-bold text-slate-500">클라우드 통신 중...</p>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen flex flex-col text-slate-700">
          <Header />
          {isLoading && <LoadingOverlay />}
          
          {feedback && (
            <div className="fixed top-16 left-1/2 transform -translate-x-1/2 bg-slate-800/95 text-white px-5 py-2.5 rounded-xl shadow-xl z-50 animate-in text-xs font-medium backdrop-blur-sm whitespace-nowrap">
              {feedback}
            </div>
          )}

          <main className="max-w-md mx-auto px-4 py-3 w-full flex-grow">
            
            {/* 메인 홈 */}
            {view === 'home' && (
              <div className="space-y-4 pt-2">
                <div className="bg-gradient-to-br from-[#4776E6] to-[#8E54E9] px-6 py-6 rounded-[2rem] text-white shadow-xl shadow-indigo-100 relative overflow-hidden">
                  <div className="relative z-10">
                    <h2 className="text-xl font-bold mb-1">공유 학습 창고 🎓</h2>
                    <p className="opacity-80 text-[11px] font-medium leading-relaxed">
                      임용 시험 준비생들이 함께 만드는 지식 창고입니다.<br/>공부하고 싶은 과목을 아래에서 선택하세요.
                    </p>
                  </div>
                  <div className="absolute -right-6 -bottom-6 w-24 h-24 bg-white/10 rounded-full blur-2xl"></div>
                </div>

                <div className="flex items-center justify-between px-1 mb-2">
                  <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
                    <Icon name="Search" size={14} /> Available Subjects
                  </h3>
                  <button onClick={() => setView('import')} className="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full active:scale-95 transition-all">
                    + 새 데이터 추가
                  </button>
                </div>

                <div className="grid grid-cols-1 gap-3">
                  {subjects.length === 0 ? (
                    <div className="py-12 text-center bg-white rounded-3xl border border-dashed border-slate-200">
                      <p className="text-slate-400 text-xs">등록된 과목이 없습니다.</p>
                    </div>
                  ) : (
                    subjects.map((sub) => (
                      <button 
                        key={sub.id}
                        onClick={() => loadCards(sub.id)}
                        className="flex items-center p-4 bg-white rounded-2xl border border-slate-100 shadow-sm hover:border-indigo-100 transition-all active:scale-[0.98] text-left group"
                      >
                        <div className="bg-indigo-50 p-2.5 rounded-xl mr-4 text-indigo-600 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                          <Icon name="BookMarked" size={22} />
                        </div>
                        <div>
                          <div className="font-bold text-slate-800 text-sm">{sub.name}</div>
                          <div className="text-[10px] text-slate-400 mt-0.5">최근 업데이트: {new Date(sub.updatedAt).toLocaleDateString()}</div>
                        </div>
                      </button>
                    ))
                  )}
                </div>
              </div>
            )}

            {/* 과목 상세 홈 */}
            {view === 'subject-home' && selectedSubject && (
              <div className="space-y-4 pt-2 animate-in">
                <div className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm text-center relative overflow-hidden">
                  <div className="bg-indigo-100 w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-4 text-indigo-600">
                    <Icon name="BookMarked" size={28} />
                  </div>
                  <h2 className="text-xl font-black text-slate-800">{selectedSubject.name}</h2>
                  <div className="inline-block mt-3 bg-slate-50 px-4 py-1.5 rounded-full border border-slate-100">
                    <span className="text-[10px] font-bold text-slate-400 tracking-widest">문항 수: {cards.length} CARDS</span>
                  </div>
                </div>

                <div className="space-y-3">
                  <button 
                    onClick={() => {setView('study'); setCurrentCardIndex(0); setIsFlipped(false);}}
                    className="w-full flex items-center p-4 bg-white rounded-2xl border border-slate-100 shadow-sm hover:border-indigo-100 transition-all active:scale-[0.98]"
                  >
                    <div className="bg-indigo-50 p-2.5 rounded-xl mr-4 text-indigo-600"><Icon name="BookOpen" size={22} /></div>
                    <div className="text-left font-bold text-slate-800 text-sm">플래시 카드 암기</div>
                  </button>

                  <div className="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                    <div className="flex p-3 gap-3">
                      <button 
                        onClick={() => startQuiz('voice')}
                        className="flex-1 bg-slate-50 py-4 rounded-xl flex flex-col items-center justify-center gap-1.5 hover:bg-indigo-50 active:scale-95 transition-all"
                      >
                        <Icon name="Mic" className="text-indigo-500" size={20} />
                        <span className="text-[9px] font-black text-slate-600 uppercase tracking-widest">Voice Quiz</span>
                      </button>
                      <button 
                        onClick={() => startQuiz('typing')}
                        className="flex-1 bg-slate-50 py-4 rounded-xl flex flex-col items-center justify-center gap-1.5 hover:bg-emerald-50 active:scale-95 transition-all"
                      >
                        <Icon name="Keyboard" className="text-emerald-500" size={20} />
                        <span className="text-[9px] font-black text-slate-600 uppercase tracking-widest">Typing Quiz</span>
                      </button>
                    </div>
                  </div>
                  
                  <button 
                    onClick={() => setView('home')}
                    className="w-full py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest"
                  >
                    다른 과목 선택하기
                  </button>
                </div>
              </div>
            )}

            {/* 플래시 카드 모드 */}
            {view === 'study' && (
              <div className="flex flex-col items-center h-full animate-in slide-in-from-bottom-2">
                <div className="w-full flex justify-between items-center mb-4 px-1">
                  <span className="text-[9px] font-black text-slate-300 uppercase tracking-widest">{currentCardIndex + 1} / {cards.length}</span>
                  <div className="bg-indigo-50 px-2.5 py-0.5 rounded-full text-[9px] font-bold text-indigo-500 uppercase tracking-wide">{cards[currentCardIndex]?.category}</div>
                  <div className="w-6"></div> 
                </div>

                <div 
                  onClick={handleCardClick}
                  className={`w-full aspect-[4/5] max-h-[420px] relative cursor-pointer transition-all duration-500 preserve-3d shadow-xl shadow-indigo-100/30 rounded-[2rem] active:scale-[0.98] ${isFlipped ? 'rotate-y-180' : ''}`}
                >
                  <div className="absolute inset-0 bg-white flex flex-col items-center justify-center p-8 text-center backface-hidden rounded-[2rem] border border-slate-100">
                    <div className="text-[9px] text-indigo-400 font-black mb-4 uppercase tracking-[0.2em]">Question</div>
                    <div className={`font-bold text-slate-800 leading-relaxed ${cards[currentCardIndex]?.question.length > 50 ? 'text-base' : 'text-lg'}`}>
                      {cards[currentCardIndex]?.question}
                    </div>
                    <div className="mt-8 text-[9px] text-slate-300 font-bold border-t border-slate-50 pt-3 w-1/3 tracking-widest text-center animate-pulse">TOUCH FOR ANSWER</div>
                  </div>
                  <div className="absolute inset-0 bg-[#1e293b] flex flex-col items-center justify-center p-8 text-center rotate-y-180 backface-hidden rounded-[2rem] border-2 border-indigo-500/10">
                    <div className="text-[9px] text-indigo-300 font-black mb-4 uppercase tracking-[0.2em]">Answer</div>
                    <div className={`font-bold text-white leading-relaxed whitespace-pre-wrap ${cards[currentCardIndex]?.answer.length > 50 ? 'text-base' : 'text-lg'}`}>
                      {cards[currentCardIndex]?.answer}
                    </div>
                    <div className="absolute bottom-8 text-[9px] text-slate-400 font-bold tracking-widest text-center">TOUCH FOR NEXT</div>
                  </div>
                </div>

                <div className="flex w-full mt-8 justify-center">
                  <button onClick={() => setView('subject-home')} className="py-3 px-6 bg-white border border-slate-200 text-slate-400 rounded-xl font-bold text-[10px] shadow-sm active:scale-95 transition-all uppercase tracking-widest">
                    학습 종료
                  </button>
                </div>
              </div>
            )}

            {/* 퀴즈 모드 */}
            {view === 'quiz' && (
              <div className="animate-in">
                <div className="flex justify-between items-center mb-4 bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm relative overflow-hidden">
                  <div className="absolute top-0 left-0 h-1 bg-emerald-400 transition-all duration-700" style={{width: `${((currentCardIndex + 1) / cards.length) * 100}%`}}></div>
                  <div className="flex items-center gap-2 text-slate-400 font-black text-[9px] uppercase tracking-widest">
                    PROGRESS: {currentCardIndex + 1} / {cards.length}
                  </div>
                  <div className="px-3 py-1 bg-indigo-500 rounded-lg text-white font-black text-[9px] uppercase tracking-widest">
                    Score: {quizScore}
                  </div>
                </div>

                <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-50 mb-6 min-h-[200px] flex flex-col items-center justify-center text-center relative">
                  <div className="text-[9px] text-slate-300 font-black mb-3 tracking-[0.2em] uppercase">{cards[currentCardIndex]?.category}</div>
                  <h3 className={`font-bold text-slate-800 leading-snug ${cards[currentCardIndex]?.question.length > 60 ? 'text-base' : 'text-lg'}`}>{cards[currentCardIndex]?.question}</h3>
                </div>

                {quizType === 'voice' ? (
                  <div className="space-y-4">
                    <button 
                      onClick={startListening}
                      disabled={isTransitioning}
                      className={`w-full py-10 rounded-[2.5rem] flex flex-col items-center justify-center transition-all duration-500 ${isListening ? 'bg-rose-50 text-rose-600 ring-4 ring-rose-100 border-2 border-rose-200' : 'bg-slate-900 text-white shadow-xl active:scale-95'} disabled:opacity-75`}
                    >
                      {isListening ? (
                        <div className="flex flex-col items-center">
                          <div className="flex gap-1.5 mb-3">
                            {[0, 0.2, 0.4].map(d => <div key={d} className="w-2 h-2 bg-rose-500 rounded-full animate-bounce" style={{animationDelay: `${d}s`}}></div>)}
                          </div>
                          <div className="font-black text-xs tracking-widest uppercase">Listening...</div>
                        </div>
                      ) : (
                        <div className="flex flex-col items-center">
                          <Icon name="Mic" className="mb-3" size={40} />
                          <span className="font-black text-sm tracking-widest uppercase">{isTransitioning ? 'Wait...' : 'Speak Now'}</span>
                        </div>
                      )}
                    </button>
                  </div>
                ) : (
                  <div className="animate-in slide-in-from-bottom-2">
                    <div className="relative">
                      <input 
                        type="text" autoFocus value={userTypedAnswer}
                        onChange={(e) => setUserTypedAnswer(e.target.value)}
                        onKeyDown={(e) => e.key === 'Enter' && checkAnswer(userTypedAnswer)}
                        placeholder="Type answer here..."
                        disabled={isTransitioning}
                        className="w-full py-6 px-7 rounded-[2rem] border-2 border-slate-100 focus:border-emerald-400 focus:ring-4 focus:ring-emerald-50 outline-none shadow-sm transition-all text-base font-bold text-slate-800 placeholder:text-slate-200 disabled:opacity-50"
                      />
                      <button onClick={() => checkAnswer(userTypedAnswer)} disabled={isTransitioning} className="absolute right-3 top-3 bottom-3 aspect-square bg-emerald-500 text-white rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-all disabled:opacity-50 disabled:active:scale-100">
                        <Icon name="Send" size={20} />
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 업로드 화면 */}
            {view === 'import' && (
              <div className="h-full animate-in">
                <h3 className="text-sm font-black text-slate-800 mb-4 flex items-center gap-2">
                  <Icon name="Upload" size={18} className="text-indigo-600" /> 클라우드에 새 과목 등록
                </h3>
                
                <div className="space-y-5">
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 block">과목명 또는 작성자 이름</label>
                    <input 
                      type="text"
                      value={importSubjectName}
                      onChange={(e) => setImportSubjectName(e.target.value)}
                      placeholder="예: 교육학_기본, 상담이론_A"
                      className="w-full p-4 rounded-xl border border-slate-200 focus:border-indigo-400 outline-none text-sm font-bold shadow-sm"
                    />
                  </div>
                  
                  <div>
                    <div className="flex justify-between items-end mb-1.5">
                      <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest block">데이터 본문</label>
                      <label className="cursor-pointer bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg flex items-center gap-1.5 hover:bg-indigo-50 hover:text-indigo-600 transition-colors active:scale-95 shadow-sm">
                        <Icon name="FileSpreadsheet" size={14} />
                        <span className="text-[10px] font-bold">엑셀 파일 첨부</span>
                        <input type="file" accept=".xlsx, .xls, .csv" className="hidden" onChange={handleFileUpload} />
                      </label>
                    </div>
                    <textarea 
                      value={importText} onChange={(e) => setImportText(e.target.value)}
                      placeholder="A열에는 '문제', B열에는 '정답'이 적혀있는 엑셀 영역을 드래그하여 복사한 후, 여기에 그대로 붙여넣기 하세요!&#13;&#10;&#13;&#10;또는 오른쪽 위 [엑셀 파일 첨부] 버튼을 눌러 파일을 직접 올릴 수도 있습니다."
                      className="w-full h-56 p-4 rounded-xl border border-slate-200 focus:border-indigo-400 outline-none resize-none text-xs leading-relaxed shadow-sm"
                    />
                  </div>

                  <div className="flex gap-2">
                    <button onClick={() => setView('home')} className="flex-1 py-4 bg-slate-100 text-slate-500 rounded-xl font-bold text-xs">취소</button>
                    <button onClick={handleImport} className="flex-[2] py-4 bg-indigo-600 text-white rounded-xl font-black text-xs shadow-lg tracking-widest">CLOUD UPLOAD</button>
                  </div>
                </div>
              </div>
            )}

            {/* 결과 화면 */}
            {view === 'result' && (
              <div className="flex flex-col items-center pt-4 text-center animate-in pb-12">
                <div className="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-[1.5rem] flex items-center justify-center shadow-inner mb-6 mx-auto">
                  <Icon name="CheckCircle2" size={40} />
                </div>
                <h2 className="text-lg font-black text-slate-800 mb-6 tracking-tighter uppercase">Finished!</h2>
                
                <div className="bg-white w-full p-6 rounded-2xl border border-slate-100 shadow-sm mb-6">
                  <div className="text-[9px] text-slate-300 font-black uppercase tracking-[0.3em] mb-1">Score</div>
                  <div className="text-4xl font-black text-indigo-600">{quizScore} <span className="text-base text-slate-200 font-light mx-0.5">/</span> {cards.length}</div>
                </div>

                <div className="w-full text-left space-y-3 mb-8 px-1">
                  <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2 mb-3 px-1">
                    <Icon name="AlertCircle" size={12} /> Review
                  </h3>
                  {quizResults.map((res, idx) => (
                    <div key={idx} className={`p-4 rounded-xl border ${res.isCorrect ? 'bg-white border-slate-100' : 'bg-rose-50/40 border-rose-100'}`}>
                      <div className="flex justify-between items-center mb-1.5">
                        <span className="text-[8px] font-black text-slate-300 uppercase">Q{idx + 1}</span>
                        <span className={`text-[8px] font-bold uppercase tracking-widest ${res.isCorrect ? 'text-emerald-500' : 'text-rose-500'}`}>
                          {res.isCorrect ? 'Correct' : 'Incorrect'}
                        </span>
                      </div>
                      <p className="text-xs font-bold text-slate-800 mb-2">{res.question}</p>
                      <div className="space-y-1.5 pt-3 border-t border-slate-50">
                        <div className="flex gap-2">
                          <span className="text-[8px] font-black text-slate-300 w-10 pt-0.5 uppercase">Yours</span>
                          <span className={`text-[11px] ${res.isCorrect ? 'text-emerald-600' : 'text-rose-500 font-bold'}`}>{res.userAnswer || "(None)"}</span>
                        </div>
                        {!res.isCorrect && (
                          <div className="flex gap-2">
                            <span className="text-[8px] font-black text-indigo-300 w-10 pt-0.5 uppercase">Answer</span>
                            <span className="text-[11px] text-indigo-600 font-bold whitespace-pre-wrap">{res.correctAnswer}</span>
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>

                <button onClick={() => setView('subject-home')} className="w-full py-4 bg-slate-900 text-white rounded-xl font-black shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 tracking-widest uppercase text-[10px]">
                  <Icon name="RotateCcw" size={16} /> Retry This Subject
                </button>
              </div>
            )}

          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
